<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生猪出栏跟踪 · 牧原 / 温氏 / 德康</title>
<style>
:root{
  --bg:#f1f2f4; --surface:#fff; --ink:#14161a; --ink2:#3f444c; --muted:#7d838d;
  --border:#e3e5e9; --border-strong:#c8ccd3; --hover:#f7f8fa; --sunk:#fafbfc;
  --up:#c0392b; --down:#1e8449; --flat:#8b9099;
  --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.muted{color:var(--muted)}

.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border-strong)}
.topbar-in{max-width:1520px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{margin:0;font-size:15px;font-weight:650}
.brand .sub{font-size:12px;color:var(--muted)}
.asof{font-size:11.5px;color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap}
.asof b{font-family:var(--mono);font-weight:600}
.asof i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink2);font-family:inherit;font-size:12px;
  padding:5px 11px;cursor:pointer;border-right:1px solid var(--border);min-height:28px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

main{max-width:1520px;margin:0 auto;padding:16px 20px 60px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.panel-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--border)}
.panel-h h2{margin:0;font-size:13.5px;font-weight:650;white-space:nowrap}
.panel-h .hint{font-size:11.5px;color:var(--muted)}
.panel-h .spacer{margin-left:auto}
.note{background:#fdfaf3;border-bottom:1px solid #ecdfc6;color:#7d5c22;padding:8px 16px;font-size:11.5px;line-height:1.7}
footer{max-width:1520px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:11.5px;line-height:1.8}

table{width:100%;border-collapse:collapse}
th,td{padding:7px 13px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
thead th{background:var(--surface);font-weight:600;color:var(--ink2);font-size:11.5px}
.cmp thead th{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border-strong)}
.cmp tbody tr:hover{background:var(--hover)}
.cmp td.metric,.cmp th.metric{text-align:left;color:var(--ink2);font-size:12px}
.cmp td.metric small{display:block;color:var(--muted);font-size:10.5px;font-weight:400}
.big{font-size:19px;font-weight:600;letter-spacing:-.01em}
.chg{font-size:11.5px;margin-top:1px;color:var(--ink2)}
.chg .lbl{color:var(--muted);margin-right:3px}
.co-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.scroll{overflow:auto}
.scroll.tall{max-height:540px}
.scroll.tall thead th{position:sticky;top:0;z-index:2}
.bar{position:relative;display:block;height:14px;background:var(--sunk);border-radius:2px;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;opacity:.75}
tr.regrow{cursor:pointer}
tr.regrow:hover{background:var(--hover)}
tr.regrow .caret{display:inline-block;width:13px;color:var(--muted);transition:transform .12s;font-size:10px}
tr.regrow.open .caret{transform:rotate(90deg);color:var(--ink2)}
tr.subrow>td{padding:0 0 8px 0;background:var(--sunk);border-bottom:1px solid var(--border)}
table.sub{background:var(--sunk)}
table.sub th{background:var(--sunk);font-size:11px}
table.sub td,table.sub th{padding:5px 13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border)}
.card{background:var(--surface);padding:12px 16px}
.card .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.card .v{font-size:21px;font-weight:600;font-family:var(--mono);letter-spacing:-.01em}
.card .u{font-size:11px;color:var(--muted);margin-left:3px;font-family:var(--sans);font-weight:400}
#chartWrap{position:relative;padding:8px 8px 4px}
#chart{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:rgba(20,22,26,.94);color:#fff;border-radius:var(--r);
  padding:8px 10px;font-size:12px;line-height:1.65;display:none;z-index:5;white-space:nowrap}
.tip .t-date{font-weight:600;margin-bottom:3px}
.tip .t-row{display:flex;gap:12px;justify-content:space-between}
.tip .t-row i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.tip .t-row b{font-family:var(--mono);font-weight:600}
.tip .t-note{color:#b9bec7;font-size:11px;margin-top:3px}
.axis{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.grid{stroke:#eceef1;stroke-width:1}
.grid.base{stroke:var(--border-strong)}
.tick-line{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:3 3}
@media(max-width:760px){
  .topbar-in{padding:10px 12px;gap:10px}
  main{padding:12px 12px 40px}
  th,td{padding:6px 8px}
  .big{font-size:16px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>生猪出栏跟踪</h1>
      <span class="sub">牧原 · 温氏 · 德康</span>
    </div>
    <div class="asof" id="asof"></div>
    <div class="seg" id="rangeSeg">
      <button data-n="30">近30天</button>
      <button data-n="60">近60天</button>
      <button data-n="0">全部</button>
    </div>
  </div>
</header>

<main>
  <!-- 1. 三家对比 -->
  <section class="panel">
    <div class="panel-h">
      <h2>三家对比</h2>
      <span class="hint" id="cmpDate"></span>
    </div>
    <div class="scroll"><table class="cmp" id="cmpTable"></table></div>
  </section>

  <!-- 2. 走势 -->
  <section class="panel">
    <div class="panel-h">
      <h2>出栏量走势</h2>
      <div class="seg" id="metricSeg">
        <button data-m="day">日度</button>
        <button data-m="week">当周累计</button>
        <button data-m="month">当月累计</button>
      </div>
      <span class="hint" id="chartUnit"></span>
      <div class="legend spacer" id="legend" style="display:flex;gap:14px;font-size:12px;color:var(--ink2)"></div>
    </div>
    <div id="chartWrap"><svg id="chart" viewBox="0 0 1300 340" preserveAspectRatio="xMidYMid meet"></svg><div class="tip" id="tip"></div></div>
  </section>

  <!-- 3. 结构拆解 -->
  <section class="panel">
    <div class="panel-h">
      <h2>结构拆解</h2>
      <div class="seg" id="splitSeg">
        <button data-c="muyuan">牧原 · 分省</button>
        <button data-c="wens">温氏 · 江皖</button>
        <button data-c="dekang">德康 · 分区域</button>
      </div>
      <span class="hint" id="splitDate"></span>
    </div>
    <div class="scroll" id="splitBody"></div>
  </section>

  <!-- 4. 德康当日明细 -->
  <section class="panel">
    <div class="panel-h">
      <h2>德康出栏明细</h2>
      <span class="hint" id="dkDate"></span>
      <span class="hint spacer" id="dkNote"></span>
    </div>
    <div class="cards" id="dkCards"></div>
    <div class="scroll tall" id="dkBody"></div>
  </section>

  <!-- 5. 日度明细 -->
  <section class="panel">
    <div class="panel-h">
      <h2>日度明细</h2>
      <div class="seg" id="basisSeg">
        <button data-b="dod">日环比</button>
        <button data-b="wow">周环比</button>
        <button data-b="mom">月环比</button>
      </div>
    </div>
    <div class="scroll tall"><table class="cmp" id="detailTable"></table></div>
  </section>
</main>

<footer>
  数据来源：<span id="srcLabel">—</span> ｜ 页面由 Hermes Agent 维护，收到新数据后自动更新。
</footer>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const D = window.PIG_DATA;
const CO = D.companies, IDS = CO.map(c=>c.id), CMAP = {}; CO.forEach(c=>CMAP[c.id]=c);
const ROWS = D.daily.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
const IDX = {}; ROWS.forEach((r,i)=> IDX[r.date]=i);
const DKD = D.dkDetail;
const state = {range:30, metric:"day", split:"muyuan", basis:"dod"};

/* ---------- 取值：三家的“日出栏/订购量”，单位统一为头 ---------- */
function vol(row, id){
  const o = row && row[id]; if(!o) return null;
  if(id === "dekang") return (o.ordered === undefined ? null : o.ordered);
  return (o.total === undefined ? null : o.total);
}
const WAN = 10000;

/* ---------- 日期工具 ---------- */
function shift(s, n){ const t=new Date(s+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function dowMon(s){ return (new Date(s+"T00:00:00Z").getUTCDay()+6)%7; }   // 0=周一
function weekStart(s){ return shift(s, -dowMon(s)); }
function prevMonthSameDay(s){
  let y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
  m-=1; if(m<1){ m=12; y--; }
  const dim = new Date(Date.UTC(y,m,0)).getUTCDate();
  return y+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(d,dim)).padStart(2,"0");
}
function fmtWan(v, dp){ return (v===null||v===undefined||isNaN(v)) ? "—" : (v/WAN).toFixed(dp===undefined?2:dp); }
function fmt(v, dp){ return (v===null||v===undefined||isNaN(v)) ? "—" : Number(v).toFixed(dp); }
function pct(v, dp){ return (v===null||v===undefined||isNaN(v)) ? "—" : (v*100).toFixed(dp===undefined?1:dp)+"%"; }
function cls(x){ return x===null||x===undefined||isNaN(x) ? "flat" : (x>0?"up":(x<0?"down":"flat")); }
function arrow(x){ return x===null||x===undefined||isNaN(x) ? "" : (x>0?"▲":(x<0?"▼":"＝")); }

/* 某公司最后一次有数据的下标 */
function lastIdx(id){
  for(let i=ROWS.length-1;i>=0;i--) if(vol(ROWS[i], id) !== null) return i;
  return -1;
}
/* 上一个有数据的下标 */
function prevIdx(id, i){
  for(let j=i-1;j>=0;j--) if(vol(ROWS[j], id) !== null) return j;
  return -1;
}
function dateGap(a, b){ return Math.abs((new Date(a+"T00:00:00Z") - new Date(b+"T00:00:00Z"))/86400000); }

/* 日环比：上一个数据日距今超过 4 天（跨过周末上限）视为序列断开，返回 null —— 
   否则会出现“德康 09-14 对比 08-16”这类跨月比较，方向对但结论错。 */
function dodChg(id, i){
  const j = prevIdx(id, i);
  if(i < 0 || j < 0) return null;
  if(dateGap(ROWS[i].date, ROWS[j].date) > 4) return null;
  const a = vol(ROWS[i], id), b = vol(ROWS[j], id);
  return b ? (a-b)/b : null;
}
/* 周期环比：本期与上期同期的“有数据天数”差得太远就不可比（德康 9 月只有 1 天数据） */
function perChg(id, anchor, kind){
  const cur = periodSum(id, anchor, kind, 0), pre = periodSum(id, anchor, kind, -1);
  if(cur.n === 0 || pre.n === 0 || !pre.sum) return null;
  const r = cur.n / pre.n;
  if(r > 1.6 || r < 0.62) return null;
  return (cur.sum - pre.sum) / pre.sum;
}
const _sumCache = new Map();
/* 区间求和（按自然日区间过滤已有数据的行） */
function sumRange(id, from, to){
  const ck = id+"|"+from+"|"+to;
  if(_sumCache.has(ck)) return _sumCache.get(ck);
  let s=0, n=0;
  for(let i=0;i<ROWS.length;i++){
    const d = ROWS[i].date;
    if(d < from || d > to) continue;
    const v = vol(ROWS[i], id);
    if(v !== null){ s += v; n++; }
  }
  const res = {sum:s, n:n};
  _sumCache.set(ck, res);
  return res;
}
/* 对等的周期累计：okind='w' 本周期/上周期同期；'m' 本月/上月同期 */
function periodSum(id, anchor, kind, offset){
  let from, to;
  if(kind === "w"){
    const ws = weekStart(anchor);
    const span = (new Date(anchor+"T00:00:00Z") - new Date(ws+"T00:00:00Z"))/86400000;
    from = shift(ws, offset*7); to = shift(from, span);
  } else {
    if(offset === 0){ from = anchor.slice(0,8)+"01"; to = anchor; }
    else { const pm = prevMonthSameDay(anchor); from = pm.slice(0,8)+"01"; to = pm; }
  }
  return sumRange(id, from, to);
}

/* ---------- 顶栏：三家数据截至 ---------- */
function renderAsof(){
  document.getElementById("asof").innerHTML = CO.map(c=>
    '<span><i style="background:'+c.color+'"></i>'+c.name+' <b>'+(c.asOf||"—").slice(5)+'</b></span>').join("")
    + '<span class="muted">德康为分区域明细日，口径见下</span>';
  document.getElementById("srcLabel").textContent = D.meta.source || "—";
}

/* ---------- 区块1：三家对比 ---------- */
function renderCompare(){
  const ii = {}; IDS.forEach(id=> ii[id] = lastIdx(id));
  const dates = IDS.map(id=> ii[id]>=0 ? ROWS[ii[id]].date : "—");
  let note = "各家最新数据日：" + IDS.map((id,k)=> CMAP[id].name+" "+dates[k]).join("　·　");
  const di = lastIdx("dekang"), dj = di>=0 ? prevIdx("dekang", di) : -1;
  if(dj >= 0 && dateGap(ROWS[di].date, ROWS[dj].date) > 4){
    note += "　｜　德康 " + ROWS[di].date.slice(5) + " 为单日分区域明细，与 " + ROWS[dj].date.slice(5)
          + " 起的日度序列不连续（间隔 " + dateGap(ROWS[di].date, ROWS[dj].date) + " 天），环比留空";
  }
  document.getElementById("cmpDate").textContent = note;

  const rows = [];
  rows.push({
    label:"日出栏量", unit:"万头 / 头", kind:"d",
    val:(id)=>{ const i=ii[id]; return i<0?null:vol(ROWS[i], id); },
    raw:(id)=>{ const i=ii[id]; if(i<0) return ""; const v=vol(ROWS[i], id); return v===null?"":("("+v.toLocaleString()+" 头)"); },
    chg:(id)=>{ const i=ii[id]; return i<0 ? null : dodChg(id, i); },
    chgLbl:"日"
  });
  rows.push({
    label:"当周累计", unit:"周一至今", kind:"w",
    val:(id)=>{ const i=ii[id]; return i<0?null:periodSum(id, ROWS[i].date, "w", 0).sum; },
    chg:(id)=>{ const i=ii[id]; return i<0 ? null : perChg(id, ROWS[i].date, "w"); },
    chgLbl:"周"
  });
  rows.push({
    label:"当月累计", unit:"月初至今", kind:"m",
    val:(id)=>{ const i=ii[id]; return i<0?null:periodSum(id, ROWS[i].date,"m",0).sum; },
    chg:(id)=>{ const i=ii[id]; return i<0 ? null : perChg(id, ROWS[i].date, "m"); },
    chgLbl:"月"
  });

  let h = "<thead><tr><th class='metric'>指标</th>";
  CO.forEach(c=> h += '<th><span class="co-dot" style="background:'+c.color+'"></span>'+c.name
    + '<small style="display:block;color:var(--muted);font-weight:400">'+(c.sub||"")+'</small></th>');
  h += "</tr></thead><tbody>";
  rows.forEach(r=>{
    h += '<tr><td class="metric">'+r.label+'<small>'+r.unit+'</small></td>';
    IDS.forEach(id=>{
      const v = r.val(id), c = r.chg(id);
      h += '<td><div class="big num">'+fmtWan(v, 2)+'</div>'
        +  (r.raw ? '<div class="chg"><span class="lbl">'+r.raw(id)+'</span></div>' : '')
        +  '<div class="chg"><span class="lbl">'+r.chgLbl+'</span>'
        +  (c===null ? '<span class="flat">—</span>'
            : '<span class="'+cls(c)+'">'+arrow(c)+pct(Math.abs(c),2)+'</span>')
        +  '</div></td>';
    });
    h += "</tr>";
  });
  h += "</tbody>";
  document.getElementById("cmpTable").innerHTML = h;
}

/* ---------- 区块2：走势 ---------- */
const NS="http://www.w3.org/2000/svg";
function svgEl(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
function visible(){
  if(state.range <= 0) return ROWS;
  const from = shift(ROWS[ROWS.length-1].date, -state.range);
  return ROWS.filter(r => r.date >= from);
}
function seriesValue(row, id){
  if(state.metric === "day") return vol(row, id);
  const kind = state.metric === "week" ? "w" : "m";
  return periodSum(id, row.date, kind, 0).sum || null;
}
function renderChart(){
  const rows = visible(), svg = document.getElementById("chart");
  svg.innerHTML = "";
  const W=1300, H=340, P={t:16, r:18, b:34, l:66};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const vals=[];
  rows.forEach(r=> IDS.forEach(id=>{ const v=seriesValue(r,id); if(v!==null && v!==0) vals.push(v/WAN); }));
  if(!vals.length){ const t=svgEl("text",{x:W/2,y:H/2,"text-anchor":"middle",class:"axis"}); t.textContent="无数据"; svg.appendChild(t); return; }
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(hi-lo<1e-9){ hi+=0.5; lo-=0.5; }
  const pad=(hi-lo)*0.12; hi+=pad; lo=Math.max(0, lo-pad);
  const X = i => P.l + (rows.length===1 ? iw/2 : i*(iw/(rows.length-1)));
  const Y = v => P.t + (1-(v-lo)/(hi-lo))*ih;

  const T=4;
  for(let t=0;t<=T;t++){
    const v = lo+(hi-lo)*t/T, yy=Y(v);
    svg.appendChild(svgEl("line",{x1:P.l,x2:P.l+iw,y1:yy,y2:yy,class:"grid"+(t===0?" base":"")}));
    const tx=svgEl("text",{x:P.l-9,y:yy+4,"text-anchor":"end",class:"axis"}); tx.textContent=v.toFixed(1); svg.appendChild(tx);
  }
  const step = Math.max(1, Math.ceil(rows.length/9));
  rows.forEach((r,i)=>{
    if(i%step!==0 && i!==rows.length-1) return;
    const t=svgEl("text",{x:X(i),y:P.t+ih+20,"text-anchor":"middle",class:"axis"});
    t.textContent=r.date.slice(5); svg.appendChild(t);
  });
  CO.forEach(c=>{
    let d="", started=false;
    rows.forEach((r,i)=>{
      const v=seriesValue(r,c.id);
      if(v===null || v===0){ started=false; return; }
      d += (started?"L":"M") + X(i).toFixed(1) + " " + Y(v/WAN).toFixed(1) + " ";
      started=true;
    });
    if(d) svg.appendChild(svgEl("path",{d:d,fill:"none",stroke:c.color,"stroke-width":1.7,"stroke-linejoin":"round","stroke-linecap":"round"}));
  });
  const hover = svgEl("line",{x1:0,x2:0,y1:P.t,y2:P.t+ih,class:"tick-line",opacity:0}); svg.appendChild(hover);
  const dots = CO.map(c=>{ const d=svgEl("circle",{r:3.2,fill:"#fff",stroke:c.color,"stroke-width":1.8,opacity:0}); svg.appendChild(d); return d; });

  const tip = document.getElementById("tip");
  svg.addEventListener("mousemove", ev=>{
    const box=svg.getBoundingClientRect();
    const rx=(ev.clientX-box.left)/box.width*W;
    let idx=Math.round((rx-P.l)/(iw/Math.max(1,rows.length-1)));
    idx=Math.max(0,Math.min(rows.length-1,idx));
    const r=rows[idx];
    hover.setAttribute("x1",X(idx)); hover.setAttribute("x2",X(idx)); hover.setAttribute("opacity",1);
    let html='<div class="t-date">'+r.date+"</div>";
    CO.forEach((c,k)=>{
      const v=seriesValue(r,c.id);
      if(v===null || v===0){ dots[k].setAttribute("opacity",0);
        html+='<div class="t-row"><span><i style="background:'+c.color+'"></i>'+c.name+'</span><b class="muted">—</b></div>'; return; }
      dots[k].setAttribute("cx",X(idx)); dots[k].setAttribute("cy",Y(v/WAN)); dots[k].setAttribute("opacity",1);
      html+='<div class="t-row"><span><i style="background:'+c.color+'"></i>'+c.name+'</span><b>'+fmtWan(v,2)+'</b></div>';
    });
    if(r.dekang && r.dekang.fromDetail) html+='<div class="t-note">德康为当日分区域明细合计</div>';
    tip.innerHTML=html; tip.style.display="block";
    const hb=document.getElementById("chartWrap").getBoundingClientRect();
    let lx=ev.clientX-hb.left+14, ly=ev.clientY-hb.top+10;
    if(lx+tip.offsetWidth>hb.width-8) lx=ev.clientX-hb.left-tip.offsetWidth-14;
    tip.style.left=lx+"px"; tip.style.top=ly+"px";
  });
  svg.addEventListener("mouseleave", ()=>{ tip.style.display="none"; hover.setAttribute("opacity",0); dots.forEach(d=>d.setAttribute("opacity",0)); });
  document.getElementById("legend").innerHTML = CO.map(c=>'<span><i style="display:inline-block;width:14px;height:2px;background:'+c.color+';margin-right:6px;vertical-align:3px"></i>'+c.name+'</span>').join("");
}

/* ---------- 区块3：结构拆解 ---------- */
function bar(v, max, color){
  const w = max>0 ? Math.max(2, v/max*100) : 0;
  return '<span class="bar"><i style="width:'+w.toFixed(1)+'%;background:'+color+'"></i></span>';
}
function renderSplit(){
  const id = state.split, box = document.getElementById("splitBody"), c = CMAP[id];
  let h = "";
  if(id === "muyuan"){
    const i = lastIdx(id), r = ROWS[i], o = r.muyuan || {}, prov = o.prov || {};
    const keys = Object.keys(prov).sort((a,b)=> prov[b]-prov[a]);
    const sum = keys.reduce((s,k)=> s+prov[k], 0);
    const prev = provOf(prevIdx(id,i), "muyuan");
    const max = Math.max.apply(null, keys.map(k=>prov[k]).concat([1]));
    document.getElementById("splitDate").textContent = r.date + "　分省合计 " + (sum/WAN).toFixed(2)
      + " 万头　·　MY外销合计 " + (o.total/WAN).toFixed(2) + " 万头"
      + (Math.abs(sum-o.total)>1 ? "　⚠ 两者口径不一致" : "");
    h = '<table class="cmp"><thead><tr><th>省份</th><th>出栏量（头）</th><th>占比</th><th style="width:130px">结构</th><th>环比</th></tr></thead><tbody>';
    keys.forEach(k=>{
      const v = prov[k], pv = prev[k];
      const ch = (pv!==undefined && pv!==null && pv!==0) ? (v-pv)/pv : null;
      h += '<tr><td>'+k+'</td><td class="num">'+v.toLocaleString()+'</td>'
        +  '<td class="num">'+pct(v/sum,1)+'</td>'
        +  '<td>'+bar(v, max, c.color)+'</td>'
        +  '<td class="num">'+(ch===null?'<span class="flat">—</span>':'<span class="'+cls(ch)+'">'+arrow(ch)+pct(Math.abs(ch),1)+'</span>')+'</td></tr>';
    });
    h += '<tr style="background:var(--sunk)"><td><b>MY外销合计</b></td><td class="num"><b>'+o.total.toLocaleString()+'</b></td><td>—</td><td>—</td><td>—</td></tr>';
    h += "</tbody></table>";
  } else if(id === "wens"){
    const i = lastIdx(id), r = ROWS[i], o = r.wens || {};
    const j = prevIdx(id,i), p = (j>=0 && ROWS[j].wens) ? ROWS[j].wens : {};
    const items = [["江苏温氏", o.js, p.js], ["安徽温氏", o.ah, p.ah]];
    const sum = (o.js||0)+(o.ah||0), max = Math.max(o.js||0, o.ah||0, 1);
    document.getElementById("splitDate").textContent = r.date + "　两地合计 " + (sum/WAN).toFixed(2) + " 万头"
      + (o.total && Math.abs(o.total-sum)>1 ? "　⚠ 表内总计 "+o.total.toLocaleString() : "");
    h = '<table class="cmp"><thead><tr><th>区域</th><th>出栏量（头）</th><th>占比</th><th style="width:130px">结构</th><th>环比</th></tr></thead><tbody>';
    items.forEach(it=>{
      const v=it[1], pv=it[2], ch=(pv? (v-pv)/pv : null);
      h += '<tr><td>'+it[0]+'</td><td class="num">'+(v===null?"—":v.toLocaleString())+'</td>'
        +  '<td class="num">'+(v===null?"—":pct(v/sum,1))+'</td>'
        +  '<td>'+(v===null?"":bar(v,max,c.color))+'</td>'
        +  '<td class="num">'+(ch===null?'<span class="flat">—</span>':'<span class="'+cls(ch)+'">'+arrow(ch)+pct(Math.abs(ch),1)+'</span>')+'</td></tr>';
    });
    h += '<tr style="background:var(--sunk)"><td><b>两地总计</b></td><td class="num"><b>'+sum.toLocaleString()+'</b></td><td>—</td><td>—</td><td>—</td></tr>';
    h += "</tbody></table>";
  } else {
    document.getElementById("splitDate").textContent = DKD.date + "　13 个区域公司";
    const max = Math.max.apply(null, DKD.regions.map(r=>r.plan).concat([1]));
    h = '<table class="cmp"><thead><tr><th>区域公司</th><th>计划出栏（头）</th><th>实际订购（头）</th>'
      + '<th>订购率</th><th>加权出栏价</th><th>加权均重</th><th style="width:110px">计划结构</th></tr></thead><tbody>';
    DKD.regions.forEach(rg=>{
      h += '<tr><td>'+rg.name+'</td><td class="num">'+rg.plan.toLocaleString()+'</td>'
        +  '<td class="num">'+rg.ordered.toLocaleString()+'</td>'
        +  '<td class="num">'+fmt(rg.orderRate*100,1)+'%</td>'
        +  '<td class="num">'+fmt(rg.price,2)+'</td>'
        +  '<td class="num">'+fmt(rg.weight,1)+'</td>'
        +  '<td>'+bar(rg.plan, max, c.color)+'</td></tr>';
    });
    const t = DKD.total;
    h += '<tr style="background:var(--sunk)"><td><b>合计</b></td><td class="num"><b>'+t.plan.toLocaleString()+'</b></td>'
      +  '<td class="num"><b>'+t.ordered.toLocaleString()+'</b></td><td class="num"><b>'+fmt(t.rateCalc*100,1)+'%</b></td>'
      +  '<td class="num"><b>'+fmt(t.price,2)+'</b></td><td class="num"><b>'+fmt(t.weight,1)+'</b></td><td>—</td></tr>';
    h += "</tbody></table>";
  }
  box.innerHTML = h;
}
function provOf(i, cid){
  if(i<0 || !ROWS[i][cid]) return {};
  return ROWS[i][cid].prov || {};
}

/* ---------- 区块4：德康当日明细 ---------- */
function renderDk(){
  const t = DKD.total;
  document.getElementById("dkDate").textContent = DKD.date + "　" + t.nRegion + " 个区域公司 · " + t.nBatch + " 个出栏批次";
  document.getElementById("dkNote").innerHTML = '<span class="muted">加权口径：按各批次计划出栏量加权 · 点击区域行展开养户级明细</span>';
  const cards = [
    {k:"计划出栏", v:fmtWan(t.plan,2), u:"万头"},
    {k:"实际订购", v:fmtWan(t.ordered,2), u:"万头"},
    {k:"订购率（订购/计划）", v:fmt(t.rateCalc*100,1), u:"%"},
    {k:"加权出栏价", v:fmt(t.price,2), u:"元/公斤"},
    {k:"加权均重", v:fmt(t.weight,1), u:"公斤/头"},
  ];
  document.getElementById("dkCards").innerHTML = cards.map(c=>
    '<div class="card"><div class="k">'+c.k+'</div><div class="v">'+c.v+'<span class="u">'+c.u+'</span></div></div>').join("");

  const max = Math.max.apply(null, DKD.regions.map(r=>r.plan).concat([1]));
  let h = '<table class="cmp"><thead><tr><th>区域公司</th><th>计划出栏</th><th>实际订购</th><th>订购率</th>'
        + '<th>加权出栏价</th><th>加权均重</th><th>批次</th><th>养户</th><th style="width:110px">计划结构</th></tr></thead><tbody>';
  DKD.regions.forEach((rg,gi)=>{
    h += '<tr class="regrow" data-r="'+gi+'">'
      +  '<td><span class="caret">▶</span>'+rg.name+'</td>'
      +  '<td class="num">'+rg.plan.toLocaleString()+'</td>'
      +  '<td class="num">'+rg.ordered.toLocaleString()+'</td>'
      +  '<td class="num">'+fmt(rg.orderRate*100,1)+'%</td>'
      +  '<td class="num">'+fmt(rg.price,2)+'</td><td class="num">'+fmt(rg.weight,1)+'</td>'
      +  '<td class="num">'+rg.nBatch+'</td><td class="num">'+rg.nFarm+'</td>'
      +  '<td>'+bar(rg.plan, max, CMAP.dekang.color)+'</td></tr>';
    h += '<tr class="subrow" data-s="'+gi+'" hidden><td colspan="9">'
      +  '<table class="cmp sub"><thead><tr><th>养户 / 场</th><th>计划出栏（头）</th><th style="text-align:left">品种</th>'
      +  '<th>出栏价</th><th>均重</th><th>报价次数</th></tr></thead><tbody>'
      +  rg.batches.map(b=> '<tr><td style="padding-left:26px">'+b.farm+'</td>'
          + '<td class="num">'+(b.plan===null?"—":b.plan.toLocaleString())+'</td>'
          + '<td class="muted" style="text-align:left">'+b.breed+'</td>'
          + '<td class="num">'+fmt(b.price,2)+'</td><td class="num">'+fmt(b.weight,1)+'</td>'
          + '<td class="num">'+(b.quotes===null?"—":b.quotes)+'</td></tr>').join("")
      +  '</tbody></table></td></tr>';
  });
  h += '<tr style="background:var(--sunk)"><td><b>合计</b></td><td class="num"><b>'+t.plan.toLocaleString()+'</b></td>'
    +  '<td class="num"><b>'+t.ordered.toLocaleString()+'</b></td><td class="num"><b>'+fmt(t.rateCalc*100,1)+'%</b></td>'
    +  '<td class="num"><b>'+fmt(t.price,2)+'</b></td><td class="num"><b>'+fmt(t.weight,1)+'</b></td>'
    +  '<td class="num"><b>'+t.nBatch+'</b></td><td>—</td><td>—</td></tr></tbody></table>';
  const box = document.getElementById("dkBody");
  box.innerHTML = h;
  box.querySelectorAll("tr.regrow").forEach(tr=>{
    tr.addEventListener("click", ()=>{
      const sub = box.querySelector('tr.subrow[data-s="'+tr.dataset.r+'"]');
      sub.hidden = !sub.hidden;
      tr.classList.toggle("open", !sub.hidden);
    });
  });
}

/* ---------- 区块5：日度明细 ---------- */
function renderDetail(){
  const rows = visible().slice().reverse();
  let h = "<thead><tr><th>日期</th>";
  CO.forEach(c=> h += '<th><span class="co-dot" style="background:'+c.color+'"></span>'+c.name+'<small style="display:block;color:var(--muted);font-weight:400">万头</small></th>'
    + '<th class="muted" style="font-weight:400">'+(state.basis==="dod"?"日":(state.basis==="wow"?"周":"月"))+'环比</th>');
  h += "</tr></thead><tbody>";
  rows.forEach(r=>{
    const i = IDX[r.date];
    h += '<tr><td class="num">'+r.date+'</td>';
    IDS.forEach(id=>{
      const v = vol(r, id);
      let ch = null;
      if(v !== null){
        ch = state.basis === "dod" ? dodChg(id, i)
           : perChg(id, r.date, state.basis === "wow" ? "w" : "m");
      }
      h += '<td class="num">'+(v===null?'<span class="flat">—</span>':fmtWan(v,2))+'</td>'
        +  '<td class="num">'+(ch===null?'<span class="flat">—</span>':'<span class="'+cls(ch)+'">'+arrow(ch)+pct(Math.abs(ch),2)+'</span>')+'</td>';
    });
    h += "</tr>";
  });
  h += "</tbody>";
  document.getElementById("detailTable").innerHTML = h;
}

/* ---------- 控件 ---------- */
function wire(id, key, attr){
  const box = document.getElementById(id);
  box.addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    box.querySelectorAll("button").forEach(x=>x.removeAttribute("aria-pressed"));
    b.setAttribute("aria-pressed","true");
    state[key] = attr === "n" ? Number(b.dataset.n) : b.dataset[attr];
    renderAll();
  });
  const def = box.querySelector("button");
  if(def) def.setAttribute("aria-pressed","true");
}
function renderAll(){ renderCompare(); renderChart(); renderChartUnit(); renderSplit(); renderDetail(); }

function renderChartUnit(){
  document.getElementById("chartUnit").textContent =
    state.metric==="day" ? "单位：万头（德康为当日订购量）"
    : (state.metric==="week" ? "单位：万头（周一至今累计，德康为订购量）"
    : "单位：万头（月初至今累计，德康为订购量）");
}

renderAsof(); renderDk();
wire("rangeSeg","range","n"); wire("metricSeg","metric","m"); wire("splitSeg","split","c"); wire("basisSeg","basis","b");
renderAll();
let rz; window.addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(renderChart,120); });
window.__ready = true;
})();
</script>
