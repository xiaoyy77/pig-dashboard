<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生猪出栏跟踪 · 牧原 / 温氏 / 德康</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2314161a'/%3E%3Crect x='7' y='13' width='18' height='3' fill='%23fff'/%3E%3Crect x='9' y='7' width='4' height='5' fill='%23fff'/%3E%3Crect x='19' y='7' width='4' height='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f1f2f4; --surface:#fff; --ink:#14161a; --ink2:#3f444c; --muted:#7d838d;
  --border:#e3e5e9; --border-strong:#c8ccd3; --hover:#f7f8fa; --sunk:#fafbfc;
  --up:#c0392b; --down:#1e8449; --flat:#8b9099;
  --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.muted{color:var(--muted)}

.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border-strong)}
.topbar-in{max-width:1520px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{margin:0;font-size:15px;font-weight:650}
.brand .sub{font-size:12px;color:var(--muted)}
.asof{font-size:11.5px;color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap}
.asof b{font-family:var(--mono);font-weight:600}
.asof i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink2);font-family:inherit;font-size:12px;
  padding:5px 11px;cursor:pointer;border-right:1px solid var(--border);min-height:28px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

main{max-width:1520px;margin:0 auto;padding:16px 20px 60px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.panel-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--border)}
.panel-h h2{margin:0;font-size:13.5px;font-weight:650;white-space:nowrap}
.panel-h .hint{font-size:11.5px;color:var(--muted)}
.panel-h .spacer{margin-left:auto}
.note{background:#fdfaf3;border-bottom:1px solid #ecdfc6;color:#7d5c22;padding:8px 16px;font-size:11.5px;line-height:1.7}
footer{max-width:1520px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:11.5px;line-height:1.8}

table{width:100%;border-collapse:collapse}
th,td{padding:7px 13px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
thead th{background:var(--surface);font-weight:600;color:var(--ink2);font-size:11.5px}
.cmp thead th{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border-strong)}
.cmp tbody tr:hover{background:var(--hover)}
.cmp td.metric,.cmp th.metric{text-align:left;color:var(--ink2);font-size:12px}
.cmp td.metric small{display:block;color:var(--muted);font-size:10.5px;font-weight:400}
.big{font-size:19px;font-weight:600;letter-spacing:-.01em}
.chg{font-size:11.5px;margin-top:1px;color:var(--ink2)}
.chg .lbl{color:var(--muted);margin-right:3px}
.co-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.scroll{overflow:auto}
.scroll.tall{max-height:540px}
.scroll.tall thead th{position:sticky;top:0;z-index:2}
.bar{position:relative;display:block;height:14px;background:var(--sunk);border-radius:2px;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;opacity:.75}
tr.regrow{cursor:pointer}
tr.regrow:hover{background:var(--hover)}
tr.regrow .caret{display:inline-block;width:13px;color:var(--muted);transition:transform .12s;font-size:10px}
tr.regrow.open .caret{transform:rotate(90deg);color:var(--ink2)}
tr.subrow>td{padding:0 0 8px 0;background:var(--sunk);border-bottom:1px solid var(--border)}
table.sub{background:var(--sunk)}
table.sub th{background:var(--sunk);font-size:11px}
table.sub td,table.sub th{padding:5px 13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border)}
.card{background:var(--surface);padding:12px 16px}
.card .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.card .v{font-size:21px;font-weight:600;font-family:var(--mono);letter-spacing:-.01em}
.card .u{font-size:11px;color:var(--muted);margin-left:3px;font-family:var(--sans);font-weight:400}
#chartWrap{position:relative}
.cblock{border-bottom:1px solid var(--border)}
.cblock:last-of-type{border-bottom:0}
.ctitle{display:flex;align-items:baseline;gap:9px;padding:10px 16px 2px;font-size:12.5px}
.ctitle b{font-size:13px}
.csub{color:var(--muted);font-size:11.5px}
.cstat{margin-left:auto;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.cwrap{padding:0 8px 8px}
.cwrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:rgba(20,22,26,.94);color:#fff;border-radius:var(--r);
  padding:8px 10px;font-size:12px;line-height:1.65;display:none;z-index:5;white-space:nowrap}
.tip .t-date{font-weight:600;margin-bottom:3px}
.tip .t-row{display:flex;gap:12px;justify-content:space-between}
.tip .t-row i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.tip .t-row b{font-family:var(--mono);font-weight:600}
.tip .t-note{color:#b9bec7;font-size:11px;margin-top:3px}
.axis{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.grid{stroke:#eceef1;stroke-width:1}
.grid.base{stroke:var(--border-strong)}
.tick-line{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:3 3}
@media(max-width:760px){
  .topbar-in{padding:10px 12px;gap:10px}
  main{padding:12px 12px 40px}
  th,td{padding:6px 8px}
  .big{font-size:16px}
}

/* ---------- 锁屏 ---------- */
#lock{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);align-items:center;justify-content:center}
body.locked #lock{display:flex}
body.locked > header, body.locked > main, body.locked > footer{display:none}
.lockcard{background:var(--surface);border:1px solid var(--border-strong);border-radius:4px;padding:26px 28px 22px;width:350px;max-width:92vw;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.lockcard h2{margin:0 0 5px;font-size:16px;font-weight:650}
.lockcard p{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.6}
.lockcard input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:3px;
  font-family:var(--mono);font-size:14px;letter-spacing:.02em}
.lockcard input[type=password]:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.lockrow{display:flex;align-items:center;gap:7px;margin:12px 0 15px;font-size:12px;color:var(--ink2)}
.lockrow input{margin:0}
.lockcard button{width:100%;padding:10px;border:0;border-radius:3px;background:var(--ink);color:#fff;
  font-family:inherit;font-size:13.5px;cursor:pointer;min-height:40px}
.lockcard button:hover{background:#000}
.lockcard button:disabled{opacity:.55;cursor:default}
.lockerr{color:var(--up);font-size:12px;margin-top:9px;min-height:15px}
.locktip{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.7}
</style>
</head>
<body class="locked">

<div id="lock">
  <div class="lockcard">
    <h2>生猪出栏跟踪</h2>
    <p>牧原 · 温氏 · 德康　该页面已加密保护，请输入访问密码</p>
    <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password" spellcheck="false">
    <div class="lockrow"><input type="checkbox" id="remember" checked><label for="remember">在本机记住密码（下次免输）</label></div>
    <button id="unlockBtn">打开</button>
    <div class="lockerr" id="lockErr"></div>
    <div class="locktip">数据以 AES-256 加密存放在网页里，没有密码无法读取。</div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>生猪出栏跟踪</h1>
      <span class="sub">牧原 · 温氏 · 德康</span>
    </div>
    <div class="asof" id="asof"></div>
    <div class="seg" id="rangeSeg">
      <button data-n="30">近30天</button>
      <button data-n="60">近60天</button>

    </div>

</header>

<main>
  <!-- 1. 三家对比 -->
  <section class="panel">

      <span class="hint spacer">柱高按各自纵轴，不与其它企业共轴</span>

  <!-- 3. 结构拆解 -->
  <section class="panel">

    <div class="panel-h">
      <h2>日度明细</h2>
      <div class="seg" id="basisSeg">
        <button data-b="dod">日环比</button>
        <button data-b="wow">周环比</button>

</main>

<footer>
  数据来源：<span id="srcLabel">—</span> ｜ 页面由 Hermes Agent 维护，收到新数据后自动更新。
</footer>

<script src="data.js"></script>
<script>
(function(){
"use strict";

/* ========== 访问控制：data.js 里只有密文，凭密码本地解密 ========== */
const KEY_STORE = "pig_panel_key_v1";
const $id = id => document.getElementById(id);
function b64d(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
function b64e(buf){ const u = new Uint8Array(buf); let s = ""; for(let i=0;i<u.length;i++) s += String.fromCharCode(u[i]); return btoa(s); }
async function deriveKey(pw, salt, iter){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptWithKey(key, enc){
  try{
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(enc.iv)}, key, b64d(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return null; }
}
async function autoUnlock(enc){
  try{
    const saved = JSON.parse(localStorage.getItem(KEY_STORE) || "null");
    if(!saved || saved.f !== enc.f) return null;
    const key = await crypto.subtle.importKey("raw", b64d(saved.k), "AES-GCM", false, ["decrypt"]);
    return await decryptWithKey(key, enc);
  }catch(e){ return null; }
}
function rememberKey(key){
  try{
    crypto.subtle.exportKey("raw", key).then(raw => {
      localStorage.setItem(KEY_STORE, JSON.stringify({k:b64e(raw), f:window.PIG_ENC.f}));
    }).catch(()=>{});
  }catch(e){}
}
function showLock(enc){
  document.body.classList.add("locked");
  const pw = $id("pw"), btn = $id("unlockBtn"), err = $id("lockErr");
  setTimeout(()=>pw.focus(), 50);
  async function attempt(){
    const v = pw.value;
    if(!v){ err.textContent = "请输入密码"; return; }
    btn.disabled = true; btn.textContent = "验证中…"; err.textContent = "";
    const key = await deriveKey(v, b64d(enc.salt), enc.iter);
    const data = await decryptWithKey(key, enc);
    if(!data){
      btn.disabled = false; btn.textContent = "打开";
      err.textContent = "密码不对，请重新输入";
      pw.select();
      return;
    }
    if($id("remember").checked) rememberKey(key);
    unlock(data);
  }
  btn.addEventListener("click", attempt);
  pw.addEventListener("keydown", e => { if(e.key === "Enter") attempt(); });
}
function unlock(data){
  document.body.classList.remove("locked");
  $id("lock").style.display = "none";
  start(data);
}

function start(D){
const CO = D.companies, IDS = CO.map(c=>c.id), CMAP = {}; CO.forEach(c=>CMAP[c.id]=c);
const ROWS = D.daily.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
const IDX = {}; ROWS.forEach((r,i)=> IDX[r.date]=i);
const DKD = D.dkDetail;
const state = {range:30, metric:"day", split:"muyuan", basis:"dod", company:"muyuan"};

/* ---------- 取值：三家的“日出栏/订购量”，单位统一为头 ---------- */
function vol(row, id){
  const o = row && row[id]; if(!o) return null;
  if(id === "dekang") return (o.ordered === undefined ? null : o.ordered);
  return (o.total === undefined ? null : o.total);
}
const WAN = 10000;

/* ---------- 日期工具 ---------- */
function shift(s, n){ const t=new Date(s+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
/* 各家出栏周期起点不同（getUTCDay: 0=周日 1=周一 6=周六）
   牧原：周日 → 周五（周六无数据）　温氏：周六 → 周五　德康：自然周（周一 → 周日） */
const WEEK_START = {muyuan:0, wens:6, dekang:1};
function weekStartFor(id, s){
  const g = new Date(s + "T00:00:00Z").getUTCDay();
  const st = (WEEK_START[id] === undefined) ? 1 : WEEK_START[id];
  return shift(s, -((g - st + 7) % 7));
}
function prevMonthSameDay(s){
  let y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
  m-=1; if(m<1){ m=12; y--; }
  const dim = new Date(Date.UTC(y,m,0)).getUTCDate();
  return y+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(d,dim)).padStart(2,"0");
}
function fmtWan(v, dp){ return (v===null||v===undefined||isNaN(v)) ? "—" : (v/WAN).toFixed(dp===undefined?2:dp); }
function fmt(v, dp){ return (v===null||v===undefined||isNaN(v)) ? "—" : Number(v).toFixed(dp); }
function pct(v, dp){ return (v===null||v===undefined||isNaN(v)) ? "—" : (v*100).toFixed(dp===undefined?1:dp)+"%"; }
function cls(x){ return x===null||x===undefined||isNaN(x) ? "flat" : (x>0?"up":(x<0?"down":"flat")); }
function arrow(x){ return x===null||x===undefined||isNaN(x) ? "" : (x>0?"▲":(x<0?"▼":"＝")); }

/* 某公司最后一次有数据的下标 */
function lastIdx(id){
  for(let i=ROWS.length-1;i>=0;i--) if(vol(ROWS[i], id) !== null) return i;
  return -1;
}
/* 上一个有数据的下标 */
function prevIdx(id, i){
  for(let j=i-1;j>=0;j--) if(vol(ROWS[j], id) !== null) return j;
  return -1;
}
function dateGap(a, b){ return Math.abs((new Date(a+"T00:00:00Z") - new Date(b+"T00:00:00Z"))/86400000); }

/* 日环比：上一个数据日距今超过 4 天（跨过周末上限）视为序列断开，返回 null —— 
   否则会出现“德康 09-14 对比 08-16”这类跨月比较，方向对但结论错。 */
function dodChg(id, i){
  const j = prevIdx(id, i);
  if(i < 0 || j < 0) return null;
  if(dateGap(ROWS[i].date, ROWS[j].date) > 4) return null;
  const a = vol(ROWS[i], id), b = vol(ROWS[j], id);
  return b ? (a-b)/b : null;
}
/* 周期环比：本期与上期同期的“有数据天数”差得太远就不可比（德康 9 月只有 1 天数据） */
function perChg(id, anchor, kind){
  const cur = periodSum(id, anchor, kind, 0), pre = periodSum(id, anchor, kind, -1);
  if(cur.n === 0 || pre.n === 0 || !pre.sum) return null;
  const r = cur.n / pre.n;
  if(r > 1.6 || r < 0.62) return null;
  return (cur.sum - pre.sum) / pre.sum;
}
const _sumCache = new Map();
/* 区间求和（按自然日区间过滤已有数据的行） */
function sumRange(id, from, to){
  const ck = id+"|"+from+"|"+to;
  if(_sumCache.has(ck)) return _sumCache.get(ck);
  let s=0, n=0;
  for(let i=0;i<ROWS.length;i++){
    const d = ROWS[i].date;
    if(d < from || d > to) continue;
    const v = vol(ROWS[i], id);
    if(v !== null){ s += v; n++; }
  }
  const res = {sum:s, n:n};
  _sumCache.set(ck, res);
  return res;
}
/* 对等的周期累计：okind='w' 本周期/上周期同期；'m' 本月/上月同期 */
function periodSum(id, anchor, kind, offset){
  let from, to;
  if(kind === "w"){
    const ws = weekStartFor(id, anchor);
    const span = (new Date(anchor+"T00:00:00Z") - new Date(ws+"T00:00:00Z"))/86400000;
    from = shift(ws, offset*7); to = shift(from, span);
  } else {
    if(offset === 0){ from = anchor.slice(0,8)+"01"; to = anchor; }
    else { const pm = prevMonthSameDay(anchor); from = pm.slice(0,8)+"01"; to = pm; }
  }
  return sumRange(id, from, to);
}

/* ---------- 顶栏：三家数据截至 ---------- */
function renderAsof(){
  document.getElementById("asof").innerHTML = CO.map(c=>
    '<span><i style="background:'+c.color+'"></i>'+c.name+' <b>'+(c.asOf||"—").slice(5)+'</b></span>').join("")
    + '<span class="muted">德康为分区域明细日，口径见下</span>';
  document.getElementById("srcLabel").textContent = D.meta.source || "—";
}

/* ---------- 区块1：三家对比 ---------- */
function renderCompare(){
  const ii = {}; IDS.forEach(id=> ii[id] = lastIdx(id));
  const dates = IDS.map(id=> ii[id]>=0 ? ROWS[ii[id]].date : "—");
  let note = "各家最新数据日：" + IDS.map((id,k)=> CMAP[id].name+" "+dates[k]).join("　·　");
  const di = lastIdx("dekang"), dj = di>=0 ? prevIdx("dekang", di) : -1;
  if(dj >= 0 && dateGap(ROWS[di].date, ROWS[dj].date) > 4){
    note += "　｜　德康 " + ROWS[di].date.slice(5) + " 为单日分区域明细，与 " + ROWS[dj].date.slice(5)
          + " 起的日度序列不连续（间隔 " + dateGap(ROWS[di].date, ROWS[dj].date) + " 天），环比留空";
  }
  document.getElementById("cmpDate").textContent = note;

  const rows = [];
  rows.push({

    chg:(id)=>{ const i=ii[id]; return i<0 ? null : dodChg(id, i); },

  });
  rows.push({
    label:"当周累计", unit:"牧原 周日→周五 · 温氏 周六→周五 · 德康 周一→周日", kind:"w",
    val:(id)=>{ const i=ii[id]; return i<0?null:periodSum(id, ROWS[i].date, "w", 0).sum; },
    chg:(id)=>{ const i=ii[id]; return i<0 ? null : perChg(id, ROWS[i].date, "w"); },
    chgLbl:"周"
  });
  rows.push({
    label:"当月累计", unit:"月初至今", kind:"m",
    val:(id)=>{ const i=ii[id]; return i<0?null:periodSum(id, ROWS[i].date,"m",0).sum; },
    chg:(id)=>{ const i=ii[id]; return i<0 ? null : perChg(id, ROWS[i].date, "m"); },

  });

  let h = "<thead><tr><th class='metric'>指标</th>";
  CO.forEach(c=> h += '<th><span class="co-dot" style="background:'+c.color+'"></span>'+c.name
    + '<small style="display:block;color:var(--muted);font-weight:400">'+(c.sub||"")+'</small></th>');
  h += "</tr></thead><tbody>";
  rows.forEach(r=>{
    h += '<tr><td class="metric">'+r.label+'<small>'+r.unit+'</small></td>';
    IDS.forEach(id=>{
      const v = r.val(id), c = r.chg(id);
      h += '<td><div class="big num">'+fmtWan(v, 2)+'</div>'
        +  (r.raw ? '<div class="chg"><span class="lbl">'+r.raw(id)+'</span></div>' : '')
        +  '<div class="chg"><span class="lbl">'+r.chgLbl+'</span>'
        +  (c===null ? '<span class="flat">—</span>'
            : '<span class="'+cls(c)+'">'+arrow(c)+pct(Math.abs(c),2)+'</span>')
        +  '</div></td>';
    });
    h += "</tr>";
  });
  h += "</tbody>";
  document.getElementById("cmpTable").innerHTML = h;
}

/* ---------- 区块2：走势 ---------- */
const NS="http://www.w3.org/2000/svg";
function svgEl(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
function visible(){
  if(state.range <= 0) return ROWS;
  const from = shift(ROWS[ROWS.length-1].date, -state.range);
  return ROWS.filter(r => r.date >= from);
}
function seriesValue(row, id){
  if(state.metric === "day") return vol(row, id);
  const kind = state.metric === "week" ? "w" : "m";
  return periodSum(id, row.date, kind, 0).sum || null;
}
function metricLabel(id){
  const base = state.metric === "day" ? "日度" : (state.metric === "week" ? "当周累计" : "当月累计");
  return base + (id === "dekang" ? "订购量" : "出栏量");
}

/* 每家企业一张独立图：一天一根柱/一个点，按自然日占位（缺数据留空档），纵轴各自独立。
   德康额外给出加权出栏价与加权均重（折线，从自身区间取值以免被 0 压平）。 */
const KIND = {
  vol:   {type:"bar",  h:300, unit:"万头",    dp:2, sc:10000},
  price: {type:"line", h:240, unit:"元/公斤", dp:2, sc:1},
  weight:{type:"line", h:240, unit:"公斤/头", dp:1, sc:1}
};
function blocksFor(id){
  return (id === "dekang" && state.company === "dekang") ? ["vol", "price", "weight"] : ["vol"];
}
function blockLabel(id, k){
  if(k === "vol") return metricLabel(id);
  return (k === "price" ? "加权出栏价" : "加权均重") + "（日度）";
}
function fieldOf(row, id, key){
  const o = row[id]; if(!o) return null;
  const v = o[key];
  return (v === null || v === undefined || isNaN(v)) ? null : +v;
}
function valueOf(row, id, k){
  if(k !== "vol") return fieldOf(row, id, k);
  if(state.metric === "day") return vol(row, id);
  return periodSum(id, row.date, state.metric === "week" ? "w" : "m", 0).sum || null;
}

function renderChart(){
  const host = document.getElementById("chartWrap");
  const ids = state.company === "all" ? IDS.slice() : [state.company];
  let html = "";
  ids.forEach(id => blocksFor(id).forEach(k => {
    const K = KIND[k];
    html += '<div class="cblock"><div class="ctitle">'
      + '<span class="co-dot" style="background:' + CMAP[id].color + '"></span><b>' + CMAP[id].name + '</b>'
      + '<span class="csub">' + blockLabel(id, k) + '　单位：' + K.unit + '</span>'
      + '<span class="cstat" data-stat="' + id + '-' + k + '"></span></div>'
      + '<div class="cwrap" data-wrap="' + id + '-' + k + '">'
      + '<svg viewBox="0 0 1300 ' + K.h + '" preserveAspectRatio="xMidYMid meet"></svg></div></div>';
  }));
  host.innerHTML = html + '<div class="tip" id="tip"></div>';
  ids.forEach(id => blocksFor(id).forEach(k => drawChart(id, k)));
}

function drawChart(id, k){
  const box = document.querySelector('.cwrap[data-wrap="' + id + '-' + k + '"]');
  if(!box) return;
  const svg = box.querySelector("svg"), co = CMAP[id], K = KIND[k];
  const rows = visible();
  if(!rows.length) return;
  const days = [];
  for(let d = rows[0].date; d <= rows[rows.length-1].date; d = shift(d, 1)) days.push(d);
  const vals = days.map(d => {
    const i = IDX[d];
    if(i === undefined) return null;
    const v = valueOf(ROWS[i], id, k);
    return v === null ? null : v / K.sc;
  });
  const real = vals.filter(v => v !== null);
  if(!real.length) return;

  const W = 1300, H = K.h, P = {t:14, r:16, b:28, l:66};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  let lo, hi;
  if(K.type === "bar"){ lo = 0; hi = Math.max.apply(null, real) * 1.12; }
  else {
    lo = Math.min.apply(null, real); hi = Math.max.apply(null, real);
    if(hi - lo < 1e-9){ hi = lo + 1; lo = lo - 1; }
    const pad = (hi - lo) * 0.25; hi += pad; lo -= pad;
  }
  const slot = iw / days.length, bw = Math.max(1.5, slot * 0.68);
  const X = j => P.l + j * slot;
  const Y = v => P.t + (1 - (v - lo) / (hi - lo)) * ih;

  for(let t = 0; t <= 4; t++){
    const v = lo + (hi - lo) * t / 4, yy = Y(v);
    svg.appendChild(svgEl("line", {x1:P.l, x2:P.l+iw, y1:yy, y2:yy, class:"grid" + (t === 0 ? " base" : "")}));
    const tx = svgEl("text", {x:P.l-10, y:yy+4, "text-anchor":"end", class:"axis"});
    tx.textContent = v.toFixed(K.dp); svg.appendChild(tx);
  }

  if(K.type === "bar"){
    days.forEach((d, j) => {
      const v = vals[j]; if(v === null) return;
      const y = Y(v);
      svg.appendChild(svgEl("rect", {x:(X(j) + (slot - bw)/2).toFixed(1), y:y.toFixed(1), width:bw.toFixed(1),
        height:Math.max(1, P.t + ih - y).toFixed(1), fill:co.color, opacity:0.85, rx:1}));
    });
  } else {
    let path = "", started = false;
    days.forEach((d, j) => {
      const v = vals[j];
      if(v === null){ started = false; return; }
      path += (started ? "L" : "M") + (X(j) + slot/2).toFixed(1) + " " + Y(v).toFixed(1) + " ";
      started = true;
    });
    if(real.length > 1 && path)
      svg.appendChild(svgEl("path", {d:path, fill:"none", stroke:co.color, "stroke-width":1.8,
        "stroke-linejoin":"round", "stroke-linecap":"round"}));
    days.forEach((d, j) => {
      const v = vals[j]; if(v === null) return;
      svg.appendChild(svgEl("circle", {cx:(X(j)+slot/2).toFixed(1), cy:Y(v).toFixed(1), r:2.6, fill:co.color}));
    });
  }

  const step = Math.max(1, Math.ceil(days.length / 10));
  days.forEach((d, j) => {
    if(j % step !== 0 && j !== days.length - 1) return;
    const t = svgEl("text", {x:(X(j) + slot/2).toFixed(1), y:P.t + ih + 18, "text-anchor":"middle", class:"axis"});
    t.textContent = d.slice(5); svg.appendChild(t);
  });

  const stat = document.querySelector('.cstat[data-stat="' + id + '-' + k + '"]');
  if(stat){
    const avg = real.reduce((a, b) => a + b, 0) / real.length;
    stat.textContent = "均值 " + avg.toFixed(K.dp) + "　最高 " + Math.max.apply(null, real).toFixed(K.dp)
      + "　最低 " + Math.min.apply(null, real).toFixed(K.dp) + "　有效 " + real.length + " 天";
  }

  const tip = document.getElementById("tip"), host = document.getElementById("chartWrap");
  days.forEach((d, j) => {
    const hit = svgEl("rect", {x:X(j).toFixed(1), y:P.t, width:slot.toFixed(1), height:ih, fill:"transparent"});
    hit.addEventListener("mouseenter", () => {
      const v = vals[j];
      tip.innerHTML = '<div class="t-date">' + d + '</div>'
        + '<div class="t-row"><span><i style="background:' + co.color + '"></i>' + co.name + '</span><b>'
        + (v === null ? "—" : v.toFixed(K.dp)) + '</b></div>'
        + '<div class="t-note">' + blockLabel(id, k) + ' · ' + K.unit + '</div>';
      tip.style.display = "block";
      const hb = host.getBoundingClientRect(), bb = box.getBoundingClientRect();
      let lx = (bb.left - hb.left) + (X(j) + slot/2) / W * bb.width + 12;
      const ly = (bb.top - hb.top) + 24;
      if(lx + tip.offsetWidth > hb.width - 8) lx -= tip.offsetWidth + 26;
      tip.style.left = lx + "px"; tip.style.top = ly + "px";
    });
    svg.appendChild(hit);
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; });
}

function bar(v, max, color){
  const w = max>0 ? Math.max(2, v/max*100) : 0;
  return '<span class="bar"><i style="width:'+w.toFixed(1)+'%;background:'+color+'"></i></span>';
}

    h = '<table class="cmp"><thead><tr><th>区域</th><th>出栏量（头）</th><th>占比</th><th style="width:130px">结构</th><th>环比</th></tr></thead><tbody>';

      }
      h += '<td class="num">'+(v===null?'<span class="flat">—</span>':fmtWan(v,2))+'</td>'
        +  '<td class="num">'+(ch===null?'<span class="flat">—</span>':'<span class="'+cls(ch)+'">'+arrow(ch)+pct(Math.abs(ch),2)+'</span>')+'</td>';
    });
    h += "</tr>";
  });
  h += "</tbody>";
  document.getElementById("detailTable").innerHTML = h;
}

/* ---------- 控件 ---------- */
function wire(id, key, attr){
  const box = document.getElementById(id);
  box.addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    box.querySelectorAll("button").forEach(x=>x.removeAttribute("aria-pressed"));
    b.setAttribute("aria-pressed","true");
    state[key] = attr === "n" ? Number(b.dataset.n) : b.dataset[attr];
    renderAll();
  });
  const def = box.querySelector("button");
  if(def) def.setAttribute("aria-pressed","true");
}
function renderAll(){ renderCompare(); renderChart(); renderSplit(); renderDetail(); }


renderAsof(); renderDk();
wire("rangeSeg","range","n"); wire("metricSeg","metric","m"); wire("companySeg","company","c");
wire("splitSeg","split","c"); wire("basisSeg","basis","b");
renderAll();
let rz; window.addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(renderChart,120); });
window.__ready = true;
}

(async function boot(){
  if(window.PIG_DATA){ start(window.PIG_DATA); return; }
  const enc = window.PIG_ENC;
  if(!enc){
    document.body.classList.remove("locked");
    $id("lock").innerHTML = '<div class="lockcard"><h2>数据文件缺失</h2><p>请联系维护人重新发布。</p></div>';
    return;
  }
  const data = await autoUnlock(enc);
  if(data){ unlock(data); return; }
  showLock(enc);
})();
})();
